services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Initiates the single-node replica set on first start; transactions need it (SRS 2.3).
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    ports:
      - "4000:4000"
    environment: &server-env
      NODE_ENV: production
      PORT: 4000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      MONGO_URI: mongodb://mongo:27017/ticketrush?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_IP_ENABLED: ${RATE_LIMIT_IP_ENABLED:-true}
      PAYMENT_SUCCESS_RATE: ${PAYMENT_SUCCESS_RATE:-0.9}
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-200}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
      SMTP_URL: ${SMTP_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-only-secret-do-not-use-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # The client's nginx is one proxy hop in front of the API, so req.ip is the real client.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Release-hold and email jobs, plus the every-minute sweep (phase 5). Same image as the API.
  worker:
    build: ./server
    command: ["node", "src/worker.js"]
    environment: *server-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The React app on http://localhost:5173, served by nginx, which proxies /api, /health and /docs.
  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
