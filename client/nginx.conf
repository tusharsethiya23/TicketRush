server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The API, its health check and Swagger, on the same origin as the app.
  location ~ ^/(api|health|docs)(/|$) {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Hashed build assets never change; cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes all serve the app shell, which must never be cached stale.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
